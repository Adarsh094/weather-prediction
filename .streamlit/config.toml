# Streamlit settings used both locally and on the server.

[server]
headless = true              # never try to open a browser on the server
enableCORS = false
enableXsrfProtection = true
# Uploads are not used by this app; keep the limit small.
maxUploadSize = 5

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2a78d6"          # the validated series-1 blue
backgroundColor = "#fcfcfb"       # light chart surface
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
showErrorDetails = false     # do not leak tracebacks to public visitors
toolbarMode = "minimal"
